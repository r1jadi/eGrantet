<script>
  // Root timeline: persistent ambient motion (finite, seek-safe).
  const tl = gsap.timeline({ paused: true });

  // Teal glow breathes: 2.5s cycle, 7 half-cycles = 17.5s, then the swell owns the outro.
  tl.fromTo("#bg-glow-teal", { scale: 1, opacity: 0.85 }, { scale: 1.12, opacity: 1, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0);

  tl.fromTo("#bg-ghost", { x: 0 }, { x: -60, duration: 18, ease: "none" }, 0);
  // Glow swell peaks at the wordmark landing (beat-locked: 18.56s).
  tl.fromTo("#bg-glow-teal", { scale: 1.06, opacity: 0.92 }, { scale: 1.2, opacity: 1, duration: 0.42, ease: "power2.out", immediateRender: false }, 18.1);
  tl.fromTo("#bg-glow-teal", { scale: 1.2, opacity: 1 }, { scale: 1.1, opacity: 0.95, duration: 1.1, ease: "sine.inOut", immediateRender: false }, 18.6);
